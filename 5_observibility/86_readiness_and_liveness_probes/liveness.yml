
# Just an example
apiVersion: v1
kind: Pod
metadata:
  name: simple-webapp
  labels:
    name: simple-webapp
spec:
  containers:
  - name: web-app
    image: web-app
    ports:
    - containerPort: 8080

    livenessProbe:
      httpGet:
        path: /api/ready
        port: 8080
      # tcpSocket:
        # port: 3306
      # exec: 
      #   command:
      #     - cat
      #     - /tmp/health

      initialDelaySeconds: 10
      periodSeconds: 5
      failureThreshold: 10