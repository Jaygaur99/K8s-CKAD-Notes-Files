# first enable/check it on kubeapi server
# kube-apiserver 
# --authorization=Node,RBAC
# --others=${others} 

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer

rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get", "create", "update", "delete"]
    resourceNames: ["blue", "orange"] # allows access to blue and orange pod

  - apiGroups: [""]
    resources: ["ConfigMap"]
    verbs: ["create"]
      
    