apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-green
  labels:
    app: myapp
    type: front-end
spec:
  template:
    metadata:
      name: myapp-prod
      labels:
        version: v2
        
    spec:
      containers:
      - name: app-container
        image: iamge:2.0
        
  replicas: 5
  selector:
    matchLabels:
      version: v2