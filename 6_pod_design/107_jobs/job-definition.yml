apiVersion: batch/v1
kind: Job
metadata:
  name: math-add-job

spec:
  # basically 3 pods
  completions: 3
  # parallel
  parallelism: 3
  
  template:
    spec:
      containers:
      - name: math-add
        image: ubuntu
        command: ["expr", "3", "+", "2"]
      restartPolicy: Never


  # Now create it with k create -f ./job-pod.yml
  # Check via k get jobs