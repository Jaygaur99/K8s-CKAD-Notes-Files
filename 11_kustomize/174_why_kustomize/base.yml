# NOTE: THIS IS JUST A SAMPLE AND DO NOT FOLLOW THE ACTUAL FOLDER STRUCTURE

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx