apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      component: api
  template:
    metadata:
      labels:
        component: api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:latest    # ← real public image, no auth needed
          args:
            - "-text=Hello from API"           # responds with this on any request
            - "-listen=:3000"
          ports:
            - containerPort: 3000
          env:
            # --- MongoDB ---
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: MONGO_URI
              value: "mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@db-service:27017"
            # --- Redis ---
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URI
              value: "redis://:$(REDIS_PASSWORD)@redis-cluster-ip-service:6379"