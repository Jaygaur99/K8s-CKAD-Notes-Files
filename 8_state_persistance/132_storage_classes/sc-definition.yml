# sc-definition - Dynamic Provisioning
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: google-storage
provisioner: kubernetes.io/gce-pd
# parameters:
#   type: pd-standard
#   replication-type: regional-pd

# Now we dont need pv.

--- 
# pvc-definition

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
# This name goes in persistentVolumeClaim.claimName
  name: myclaim
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: google-storage
  resources:  
    requests:
      storage: 500Mi

